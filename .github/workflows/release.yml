name: Release Windows Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $configVersion = (
            Select-String -Path config.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          ).Matches[0].Groups[1].Value

          if ($env:GITHUB_EVENT_NAME -eq "release") {
            $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          } else {
            $version = $configVersion
          }

          "config_version=$configVersion" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=AudioTransfer-v$version-windows.exe" >> $env:GITHUB_OUTPUT

      - name: Validate release version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          if ("${{ steps.meta.outputs.version }}" -ne "${{ steps.meta.outputs.config_version }}") {
            throw "Release tag version ${{ steps.meta.outputs.version }} does not match config APP_VERSION ${{ steps.meta.outputs.config_version }}."
          }

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm AudioTransfer.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item `
            -Path "dist/AudioTransfer.exe" `
            -Destination "dist/${{ steps.meta.outputs.artifact_name }}" `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioTransfer-${{ steps.meta.outputs.version }}-windows
          path: dist/${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/${{ steps.meta.outputs.artifact_name }}
